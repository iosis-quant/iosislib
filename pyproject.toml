[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iosislib"
version = "0.0.0"
description = "Typed, deterministic, time-aware computation graphs for Polars time series"
readme = { text = "iosislib builds typed, deterministic feature and modelling graphs over Polars time-series data.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.30",
    "pyarrow>=14",
    "torch>=2.1",
]
keywords = [
    "feature-engineering",
    "machine-learning",
    "polars",
    "time-series",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
yfinance = [
    "pandas>=2.0",
    "yfinance>=0.2.40",
]
test = [
    "pandas>=2.0",
    "pytest>=8",
]
dev = [
    "build>=1.2",
    "pandas>=2.0",
    "pytest>=8",
    "twine>=5",
    "yfinance>=0.2.40",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["examples*", "temp*", "tests*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = "."
testpaths = ["tests"]
