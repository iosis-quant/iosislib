[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iosislib"
version = "0.1.0"
description = "Typed, deterministic, time-aware computation graphs for Polars time series"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "polars>=1.30",
    "PyYAML>=6.0",
    "pyarrow>=14",
    "torch>=2.1",
]
keywords = [
    "feature-engineering",
    "machine-learning",
    "polars",
    "time-series",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Chris2Rich/iosislib"
Issues = "https://github.com/Chris2Rich/iosislib/issues"
Repository = "https://github.com/Chris2Rich/iosislib.git"

[project.optional-dependencies]
acceleration = [
    "numba>=0.61",
]
lightgbm = [
    "lightgbm>=4.0",
]
yfinance = [
    "pandas>=2.0",
    "yfinance>=0.2.40",
]
test = [
    "pandas>=2.0",
    "pytest>=8",
]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "lightgbm>=4.0",
    "mypy>=1.11",
    "numba>=0.61",
    "pandas>=2.0",
    "pytest>=8",
    "ruff>=0.6",
    "twine>=5",
    "types-PyYAML>=6.0",
    "yfinance>=0.2.40",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["iosislib*"]
namespaces = false

[tool.setuptools.package-data]
iosislib = ["py.typed", "strategy/*.json"]

[tool.check-wheel-contents]
toplevel = ["iosislib"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# CI runs mypy on 3.13; Ruff and the test matrix enforce Python 3.11 compatibility.
python_version = "3.13"
explicit_package_bases = true
follow_imports = "normal"
mypy_path = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
files = [
    "src/iosislib/core/tsfn.py",
    "src/iosislib/core/node.py",
    "src/iosislib/strategy",
    "src/iosislib/tsfn/transforms",
    "tests/typing/typed_construction.py",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
