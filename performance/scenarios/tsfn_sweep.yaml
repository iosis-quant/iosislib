# TSFN sweep: every local (non-network) TSFN at two data sizes.
# Reuses existing perf datasets; catches slow or super-linear ops.
# Excluded by design: source.data_frame_source (in-memory only),
# source.polymarket_price_history + source.y_finance_ohlcv (live network),
# model.cnn1_d (torch-conv perf belongs in model unit tests, not a row sweep).
#
# Run: python performance/test_perf.py --scenario tsfn_sweep --scale-report

scenarios:
  - name: sweep_negate_100k
    description: "Negate on 100K price rows"
    data:
      name: perf_prices_100k
      rows: 100_000
      domain: prices
      format: csv
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: sweep-negate-100k
      nodes:
        source:
          op: source.csv_source
          version: "0.2.0"
          params:
            path: ../data/perf_prices_100k.csv
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                open: float64
                high: float64
                low: float64
                close: float64
                volume: int64
        negated:
          op: transform.negate
          version: "0.1.0"
          inputs:
            value: source.close
          params:
            input_column: value
            output_column: negated
      outputs:
        negated: negated.negated
    outputs: [negated]
    thresholds:
      max_us_per_row: 60.0
      max_memory_mb: 200

