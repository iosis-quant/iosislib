  - name: sweep_lightgbm_10k
    description: "LightGBM train/predict on 10K price rows"
    data:
      name: perf_prices_10k
      rows: 10_000
      domain: prices
      format: csv
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: sweep-lightgbm-10k
      nodes:
        prices:
          op: source.csv_source
          version: "0.2.0"
          params:
            path: ../data/perf_prices_10k.csv
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                open: float64
                high: float64
                low: float64
                close: float64
                volume: int64
        features:
          op: transform.feature_packer
          version: "0.2.0"
          inputs:
            close: prices.close
            volume: prices.volume
          params:
            input_columns: [close, volume]
            output_column: features
        target:
          op: transform.feature_packer
          version: "0.2.0"
          inputs:
            forward_return: prices.open
          params:
            input_columns: [forward_return]
            output_column: target
        model:
          op: model.light_gbm
          version: "0.3.0"
          inputs:
            features: features.features
            target: target.target
          params:
            num_boost_round: 20
            learning_rate: 0.05
            num_leaves: 31
            max_depth: -1
            min_data_in_leaf: 20
            early_stopping_rounds: 0
            scheduler:
              every: 5000
            splitter:
              validation_size: 0.2
              purge_window: 1
      outputs:
        prediction: model.prediction
    outputs: [prediction]
    thresholds:
      max_us_per_row: 50000.0
      max_memory_mb: 1000

