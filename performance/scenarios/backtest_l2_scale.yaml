# L2 backtester scenarios: price+volume ladders across widths and depths.
# Widths 1/8/16/32/64 assets, depths 10/25/50 per side. Every simulation
# carries a fixed fee schedule (2bp taker, -1bp maker) so runs exercise
# the fee path as well as the depth walks.
#
# Run: python performance/test_perf.py --scenario backtest_l2_scale

scenarios:

  - name: l2_backtest_10k_1asset_market
    description: "L2 baseline: 10K rows, 1 asset, market orders"
    data:
      name: perf_backtest_l2_10k_1asset_market
      rows: 10000
      width: 1
      domain: l2_market_data
      levels: 50
      format: parquet
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: l2-backtest-10k-1asset-market
      nodes:
        market_data:
          op: source.parquet_source
          version: "0.4.0"
          params:
            path: ../data/perf_backtest_l2_10k_1asset_market.parquet
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                bid_price:
                  dtype: float64
                  shape: [1, 50]
                bid_volume:
                  dtype: float64
                  shape: [1, 50]
                ask_price:
                  dtype: float64
                  shape: [1, 50]
                ask_volume:
                  dtype: float64
                  shape: [1, 50]
                signal:
                  dtype: float64
                  shape: [1]
        simulation:
          op: backtest.backtest
          version: "3.0.0"
          inputs:
            bid_price: market_data.bid_price
            bid_volume: market_data.bid_volume
            ask_price: market_data.ask_price
            ask_volume: market_data.ask_volume
            signal: market_data.signal
          params:
            initial_cash: 1000000
            fee_schedule:
              kind: fixed
              taker_rate: 0.0002
              maker_rate: -0.0001
            feed:
              kind: l2
              venue:
                name: bench
                universe: [A0]
              depth_levels: 50
            policy:
              kind: signal
              signal_column: signal
      outputs:
        equity: simulation.equity
    outputs: [equity]
    thresholds:
      max_us_per_row: 2000.0
      max_memory_mb: 300

