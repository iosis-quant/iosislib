  - name: transform_memory_1m
    description: "Transform pipeline memory: 5-node chain on 1M price rows"
    data:
      name: perf_prices_1m
      rows: 1_000_000
      domain: prices
      format: csv
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: transform-memory-1m
      nodes:
        source:
          op: source.csv_source
          version: "0.2.0"
          params:
            path: ../data/perf_prices_1m.csv
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                open: float64
                high: float64
                low: float64
                close: float64
                volume: int64
        log_close:
          op: transform.log
          version: "0.1.0"
          inputs:
            value: source.close
          params:
            input_column: value
            output_column: log
        log_delta:
          op: transform.delta
          version: "0.2.0"
          inputs:
            value: log_close.log
          params:
            input_column: value
            output_column: delta
        smoothed:
          op: transform.rolling_mean
          version: "0.1.0"
          inputs:
            value: log_delta.delta
          params:
            input_column: value
            output_column: rolling_mean
            periods: 20
        ewm_smoothed:
          op: transform.ewm_mean
          version: "0.1.0"
          inputs:
            value: smoothed.rolling_mean
          params:
            input_column: value
            output_column: ewm_mean
            alpha: 0.05
        final_pct:
          op: transform.pct_change
          version: "0.1.0"
          inputs:
            value: ewm_smoothed.ewm_mean
          params:
            input_column: value
            output_column: pct_change
      outputs:
        final_pct: final_pct.pct_change
    outputs: [final_pct]
    thresholds:
      max_us_per_row: 15.0
      max_memory_mb: 500
    memory_tracking:
      sample_interval: 10_000
      track_peak: true
      track_allocations: true

