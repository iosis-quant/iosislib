# Memory stress scenarios
# Tests memory behavior under sustained load and varying data sizes

scenarios:
  - name: backtest_memory_100k
    description: "Backtest memory tracking: 100K rows, 8 assets"
    data:
      name: perf_backtest_100k_8a
      rows: 100_000
      width: 8
      domain: market_data
      format: parquet
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: backtest-memory-100k
      nodes:
        market_data:
          op: source.parquet_source
          version: "0.3.0"
          params:
            path: ../data/perf_backtest_100k_8a.parquet
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                bid:
                  dtype: float64
                  shape: [8]
                ask:
                  dtype: float64
                  shape: [8]
                signal:
                  dtype: float64
                  shape: [8]
        simulation:
          op: backtest.backtest
          version: "1.2.0"
          inputs:
            bid: market_data.bid
            ask: market_data.ask
            signal: market_data.signal
          params:
            initial_cash: 1000000
            feed:
              kind: l1
              venue:
                name: bench
                universe: [A0, A1, A2, A3, A4, A5, A6, A7]
            policy:
              kind: signal
              signal_column: signal
      outputs:
        equity: simulation.equity
    outputs: [equity]
    thresholds:
      max_us_per_row: 100.0
      max_memory_mb: 200
    memory_tracking:
      sample_interval: 10_000
      track_peak: true
      track_allocations: true

