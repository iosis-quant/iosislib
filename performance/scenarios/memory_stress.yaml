    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: backtest-memory-1m
      nodes:
        market_data:
          op: source.parquet_source
          version: "0.3.0"
          params:
            path: ../data/perf_backtest_1m_8a.parquet
            content_sha256: FILL_HASH
            schema:
