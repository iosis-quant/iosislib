# Backtester scaling scenarios
# Tests backtester performance across row counts and asset widths
#
# Run: python -m pytest performance/test_perf.py -k "backtest_scale" -v
# Or:  python performance/test_perf.py --scenario backtest_scale

scenarios:
  - name: backtest_10k_1asset
    description: "Backtest baseline: 10K rows, 1 asset"
    data:
      name: perf_backtest_10k_1a
      rows: 10_000
      width: 1
      domain: market_data
      format: parquet
    strategy:
      format: iosis.strategy
      version: "0.1.0"
      name: backtest-10k-1a
      nodes:
        market_data:
          op: source.parquet_source
          version: "0.3.0"
          params:
            path: ../data/perf_backtest_10k_1a.parquet
            content_sha256: FILL_HASH
            schema:
              time: timestamp
              columns:
                bid:
                  dtype: float64
                  shape: [1]
                ask:
                  dtype: float64
                  shape: [1]
                signal:
                  dtype: float64
                  shape: [1]
        simulation:
          op: backtest.backtest
          version: "1.2.0"
          inputs:
            bid: market_data.bid
            ask: market_data.ask
            signal: market_data.signal
          params:
            initial_cash: 1000000
            feed:
              kind: l1
              venue:
                name: bench
                universe: [A0]
            policy:
              kind: signal
              signal_column: signal
      outputs:
        equity: simulation.equity
    outputs: [equity]
    thresholds:
      max_us_per_row: 300.0
      max_memory_mb: 50

