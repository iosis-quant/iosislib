# Benchmark: backtest with threshold policy + fractional limit risk
# Tests full backtest with risk policy on shaped market data
format: iosis.strategy
version: 0.1.0
name: backtest-threshold-risk
description: >
  Full backtest with ThresholdPolicy and FractionalLimitPolicy risk
  on shaped market data (8 assets). Tests risk policy overhead.

nodes:
  market_data:
    op: source.parquet_source
    version: 0.3.0
    params:
      path: ../data/market_data.parquet
      content_sha256: 6dabab838bee7e841e65604112fd8a3358d9afd21a58b73d2e98081cc9178c12
      schema:
        time: timestamp
        columns:
          bid:
            dtype: float64
            shape: [8]
          ask:
            dtype: float64
            shape: [8]
          signal:
            dtype: float64
            shape: [8]

  simulation:
    op: backtest.backtest
    version: 1.2.0
    inputs:
      bid: market_data.bid
      ask: market_data.ask
      signal: market_data.signal
    params:
      initial_cash: 1000000
      feed:
        kind: l1
        venue:
          name: bench
          universe: [A0, A1, A2, A3, A4, A5, A6, A7]
      policy:
        kind: threshold
        signal_column: signal
        threshold: 0.05
        long_qty: 10.0
        short_qty: 10.0
      risk_policy:
        kind: fractional_limit
        fraction: 0.25

outputs:
  equity: simulation.equity
