# Benchmark: backtest with signal policy on shaped market data
# Tests full backtest execution with declarative feed and policy
format: iosis.strategy
version: 0.1.0
name: backtest-signal
description: >
  Full backtest with SignalPolicy on shaped market data (8 assets).
  Tests BacktestTSFN execution with declarative feed and policy.

nodes:
  market_data:
    op: source.parquet_source
    version: 0.3.0
    params:
      path: ../data/market_data.parquet
      content_sha256: 6dabab838bee7e841e65604112fd8a3358d9afd21a58b73d2e98081cc9178c12
      schema:
        time: timestamp
        columns:
          bid:
            dtype: float64
            shape: [8]
          ask:
            dtype: float64
            shape: [8]
          signal:
            dtype: float64
            shape: [8]

  simulation:
    op: backtest.backtest
    version: 1.2.0
    inputs:
      bid: market_data.bid
      ask: market_data.ask
      signal: market_data.signal
    params:
      initial_cash: 1000000
      feed:
        kind: l1
        venue:
          name: bench
          universe: [A0, A1, A2, A3, A4, A5, A6, A7]
      policy:
        kind: signal
        signal_column: signal

outputs:
  equity: simulation.equity
