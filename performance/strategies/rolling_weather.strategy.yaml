# Benchmark: rolling mean and rolling std on weather temperature
# Tests rolling window operations on meteorological data
format: iosis.strategy
version: 0.1.0
name: rolling-weather
description: >
  Rolling mean and standard deviation on weather temperature.
  Measures rolling window overhead on meteorological data.

nodes:
  weather:
    op: source.csv_source
    version: 0.2.0
    params:
      path: ../data/weather.csv
      content_sha256: 9e58fd02319a690d595a5d2ee448841fdb0b6e6c079ff08ed3a1eac7ef04d8f4
      schema:
        time: timestamp
        columns:
          temperature: float64
          humidity: float64
          wind_speed: float64
          precipitation: float64

  temp_mean:
    op: transform.rolling_mean
    version: 0.1.0
    inputs:
      value: weather.temperature
    params:
      input_column: value
      output_column: rolling_mean
      periods: 60

  temp_std:
    op: transform.rolling_std
    version: 0.1.0
    inputs:
      value: weather.temperature
    params:
      input_column: value
      output_column: rolling_std
      periods: 60

outputs:
  temp_mean: temp_mean.rolling_mean
  temp_std: temp_std.rolling_std
