# Benchmark: spread between oil and grain in shipping manifests
# Tests multi-column itemwise transform on cargo data
format: iosis.strategy
version: 0.1.0
name: shipping-spread
description: >
  Spread between oil litres and grain tonnes in port cargo manifests.
  Measures itemwise struct transform overhead on shipping data.

nodes:
  shipping:
    op: source.csv_source
    version: 0.2.0
    params:
      path: data/shipping.csv
      content_sha256: 226bf9edc387ec03d2c0643447b0ae766fc61c0e4680a42c5f9229db44a982b1
      schema:
        time: timestamp
        columns:
          oil_litres: float64
          grain_tonnes: float64
          container_count: float64

  cargo_spread:
    op: transform.spread
    version: 0.1.0
    inputs:
      left: shipping.oil_litres
      right: shipping.grain_tonnes
    params:
      left_column: left
      right_column: right
      output_column: spread

outputs:
  cargo_spread: cargo_spread.spread
