# Benchmark: multiple outputs from single source
# Tests multi-output graph with parallel transform branches
format: iosis.strategy
version: 0.1.0
name: multi-output
description: >
  Multiple outputs from a single price source with parallel transform branches.
  Tests multi-output graph execution and shared source node.

nodes:
  prices:
    op: source.csv_source
    version: 0.2.0
    params:
      path: data/prices.csv
      content_sha256: 1fd7ced1e5ebc179a05e2f297ce62af7c1ebbbf4aa0a3169c7d722b5a30f9761
      schema:
        time: timestamp
        columns:
          open: float64
          high: float64
          low: float64
          close: float64
          volume: int64

  close_delta:
    op: transform.delta
    version: 0.2.0
    inputs:
      value: prices.close
    params:
      input_column: value
      output_column: delta

  close_pct:
    op: transform.pct_change
    version: 0.1.0
    inputs:
      value: prices.close
    params:
      input_column: value
      output_column: pct_change

  high_low_spread:
    op: transform.spread
    version: 0.1.0
    inputs:
      left: prices.high
      right: prices.low
    params:
      left_column: left
      right_column: right
      output_column: spread

outputs:
  close_delta: close_delta.delta
  close_pct: close_pct.pct_change
  high_low_spread: high_low_spread.spread
