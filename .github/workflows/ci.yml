name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q src/iosislib
      - name: Lint
        run: python -m ruff check src
      - name: Type check
        run: python -m mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install -e ".[test,yfinance]"
      - name: Run tracked tests
        run: python -m pytest

  distributions:
    name: Build and inspect distributions
    needs: [static-analysis, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Build sdist and wheel in isolation
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Check wheel contents
        run: check-wheel-contents dist
      - name: Install and execute outside the checkout
        shell: bash
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          smoke_env="$RUNNER_TEMP/iosislib-package-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --upgrade pip
          "$smoke_env/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" - <<'PY'
          from datetime import datetime

          import polars as pl

          from iosislib.core import FrameSignature, Graph, Node, TSFN
          from iosislib.tsfn import Logit


          class SmokeSource(TSFN):
              VERSION = "1.0.0"

              def type_signature(self) -> tuple[FrameSignature, FrameSignature]:
                  return (
                      FrameSignature.empty(),
                      FrameSignature(columns=(("value", pl.Float64),)),
                  )

              def apply(self) -> pl.LazyFrame:
                  return pl.DataFrame(
                      {"timestamp": [datetime(2026, 1, 1)], "value": [0.25]},
                      schema={"timestamp": pl.Datetime, "value": pl.Float64},
                  ).lazy()


          source = Node(SmokeSource)
          result = Graph(Node(Logit, bindings={"value": source.value})).execute()
          assert result.columns == ["timestamp", "logit"]
          assert result.height == 1
          import importlib.util
          from importlib.metadata import files
          from pathlib import Path

          installed = {str(path).replace("\\", "/") for path in files("iosislib")}
          assert "iosislib/py.typed" in installed
          assert Path(__import__("iosislib").__file__).with_name("py.typed").is_file()
          assert importlib.util.find_spec("src") is None
          PY
          "$smoke_env/bin/python" -m pip uninstall -y iosislib
          "$smoke_env/bin/python" -m pip install --no-deps "$sdist"
          "$smoke_env/bin/python" -c "from pathlib import Path; import iosislib; from iosislib.core import Graph, Node; from iosislib.tsfn import Logit; assert Path(iosislib.__file__).with_name('py.typed').is_file()"
      - name: Upload checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: iosislib-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
