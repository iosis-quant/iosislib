format: iosis.strategy/v1
name: probability-change
description: Convert a probability to log odds, then calculate its change.

nodes:
  prices:
    op: source.csv/v1
    params:
      path: prices.csv
      content_sha256: replace-with-the-source-content-sha256
      schema:
        time: timestamp
        columns:
          probability: float64

  log_odds:
    op: transform.logit/v1
    inputs:
      probability: prices.probability
    params:
      output: log_odds

  change:
    op: transform.delta/v1
    inputs:
      value:
        from: log_odds.log_odds
        nulls: propagate
    params:
      periods: 1
      output: change

outputs:
  change: change.change
